<!DOCTYPE HTML>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<title>Drawing Board</title>
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="description" content="Free online drawing board - draw, sketch, and create art" />
	<meta name="keywords" content="drawing board, sketch pad, online drawing, digital art" />
	<meta name="author" content="Yusuf Morsi" />

	<link rel="icon" type="image/svg+xml"
		href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='16' fill='%230f172a'/%3E%3Cpath d='M28 68 L36 36 L64 28 L72 56 Z' fill='none' stroke='white' stroke-width='5' stroke-linejoin='round'/%3E%3Ccircle cx='34' cy='70' r='6' fill='%2394a3b8'/%3E%3C/svg%3E">

	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
	<link rel="stylesheet" href="/new/css/github-star.css">

	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		:root {
			--ink: #0f172a;
			--muted: #64748b;
			--line: rgba(15, 23, 42, 0.08);
			--paper: #ffffff;
			--stage: #e8edf3;
			--chip: #f8fafc;
			--chip-hover: #eef2f7;
			--danger: #dc2626;
			--blue-primary: #334155;
			--blue-hover: #0f172a;
			--radius: 14px;
			--shadow: 0 10px 40px rgba(15, 23, 42, 0.08);
			--safe-top: env(safe-area-inset-top);
			--safe-bottom: env(safe-area-inset-bottom);
		}

		html,
		body {
			height: 100%;
		}

		body {
			font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			background: var(--stage);
			color: var(--ink);
			overflow: hidden;
		}

		.app {
			height: 100%;
			display: flex;
			flex-direction: column;
		}

		.topbar {
			flex-shrink: 0;
			display: flex;
			align-items: center;
			gap: 12px;
			padding: calc(10px + var(--safe-top)) 16px 10px;
			background: rgba(255, 255, 255, 0.82);
			backdrop-filter: blur(16px);
			-webkit-backdrop-filter: blur(16px);
			border-bottom: 1px solid var(--line);
			z-index: 10;
		}

		.brand {
			display: inline-flex;
			align-items: center;
			gap: 10px;
			text-decoration: none;
			color: var(--ink);
			flex-shrink: 0;
			padding: 4px 8px 4px 4px;
			border-radius: 999px;
			transition: background 0.15s ease;
		}

		.brand:hover {
			background: var(--chip-hover);
		}

		.brand img {
			width: 32px;
			height: 32px;
			border-radius: 50%;
			object-fit: cover;
		}

		.brand span {
			font-weight: 600;
			font-size: 0.95rem;
			letter-spacing: -0.02em;
		}

		.tools {
			flex: 1;
			display: flex;
			align-items: center;
			gap: 10px;
			min-width: 0;
			overflow-x: auto;
			scrollbar-width: none;
		}

		.tools::-webkit-scrollbar {
			display: none;
		}

		.cluster {
			display: flex;
			align-items: center;
			gap: 4px;
			padding: 4px;
			background: var(--chip);
			border: 1px solid var(--line);
			border-radius: 12px;
			flex-shrink: 0;
		}

		.cluster + .cluster {
			position: relative;
		}

		.btn {
			width: 38px;
			height: 38px;
			border: 0;
			background: transparent;
			border-radius: 9px;
			color: var(--ink);
			cursor: pointer;
			display: inline-flex;
			align-items: center;
			justify-content: center;
			transition: background 0.15s ease, color 0.15s ease, transform 0.15s ease;
		}

		.btn:hover {
			background: var(--chip-hover);
		}

		.btn:active {
			transform: scale(0.96);
		}

		.btn.active {
			background: var(--ink);
			color: #fff;
		}

		.btn:disabled {
			opacity: 0.35;
			cursor: default;
		}

		.btn.danger:hover,
		.btn.armed {
			background: #fef2f2;
			color: var(--danger);
		}

		.btn.armed {
			width: auto;
			padding: 0 12px;
			font-size: 0.75rem;
			font-weight: 600;
			letter-spacing: 0.02em;
		}

		.swatches {
			display: flex;
			align-items: center;
			gap: 6px;
			padding: 0 6px;
		}

		.swatch {
			width: 22px;
			height: 22px;
			border-radius: 50%;
			border: 2px solid transparent;
			box-shadow: inset 0 0 0 1px rgba(15, 23, 42, 0.12);
			cursor: pointer;
			padding: 0;
			background: var(--swatch);
			transition: transform 0.15s ease, box-shadow 0.15s ease;
		}

		.swatch:hover {
			transform: scale(1.08);
		}

		.swatch.active {
			box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--ink);
		}

		.swatch.light {
			box-shadow: inset 0 0 0 1px rgba(15, 23, 42, 0.18);
		}

		.swatch.custom {
			position: relative;
			overflow: hidden;
			background: conic-gradient(#ef4444, #eab308, #22c55e, #3b82f6, #8b5cf6, #ef4444);
		}

		.swatch.custom input {
			position: absolute;
			inset: 0;
			opacity: 0;
			cursor: pointer;
			border: 0;
			width: 100%;
			height: 100%;
		}

		.size-control {
			display: flex;
			align-items: center;
			gap: 8px;
			padding: 0 8px 0 4px;
			min-width: 140px;
		}

		.size-preview {
			width: 10px;
			height: 10px;
			border-radius: 50%;
			background: var(--ink);
			flex-shrink: 0;
			transform: scale(var(--brush-scale, 0.8));
		}

		.size-control input[type="range"] {
			-webkit-appearance: none;
			appearance: none;
			width: 92px;
			height: 4px;
			border-radius: 99px;
			background: #dbe3ee;
			outline: none;
		}

		.size-control input[type="range"]::-webkit-slider-thumb {
			-webkit-appearance: none;
			width: 14px;
			height: 14px;
			border-radius: 50%;
			background: var(--ink);
			border: 2px solid #fff;
			box-shadow: 0 1px 4px rgba(15, 23, 42, 0.25);
			cursor: pointer;
		}

		.size-value {
			font-size: 0.75rem;
			font-weight: 600;
			color: var(--muted);
			width: 18px;
			text-align: right;
			font-variant-numeric: tabular-nums;
		}

		.actions {
			display: flex;
			align-items: center;
			gap: 6px;
			flex-shrink: 0;
		}

		.back-link {
			display: inline-flex;
			align-items: center;
			gap: 6px;
			color: var(--muted);
			text-decoration: none;
			font-size: 0.82rem;
			font-weight: 500;
			padding: 8px 10px;
			border-radius: 10px;
			white-space: nowrap;
		}

		.back-link:hover {
			background: var(--chip-hover);
			color: var(--ink);
		}

		.workspace {
			flex: 1;
			min-height: 0;
			position: relative;
			background:
				radial-gradient(circle at 1px 1px, rgba(15, 23, 42, 0.07) 1px, transparent 0) 0 0 / 22px 22px,
				var(--stage);
			padding: 16px 16px 12px;
		}

		.paper {
			width: 100%;
			height: 100%;
			background: var(--paper);
			border-radius: 18px;
			box-shadow: var(--shadow);
			overflow: hidden;
			position: relative;
		}

		#drawingCanvas {
			display: block;
			width: 100%;
			height: 100%;
			cursor: crosshair;
			touch-action: none;
		}

		.page-footer {
			flex-shrink: 0;
			padding: 8px 16px calc(10px + var(--safe-bottom));
			background: rgba(255, 255, 255, 0.9);
			border-top: 1px solid var(--line);
		}

		.page-footer-inner {
			display: flex;
			flex-wrap: wrap;
			align-items: center;
			justify-content: space-between;
			gap: 6px 16px;
		}

		.page-footer-nav {
			display: flex;
			flex-wrap: wrap;
			align-items: center;
			gap: 2px 4px;
		}

		.page-footer-nav a {
			display: inline-flex;
			align-items: center;
			gap: 0.35rem;
			color: var(--muted);
			text-decoration: none;
			font-weight: 500;
			font-size: 0.78rem;
			padding: 0.28rem 0.5rem;
			border-radius: 8px;
			white-space: nowrap;
		}

		.page-footer-nav a:hover {
			color: var(--ink);
			background: var(--chip-hover);
		}

		.page-footer-nav .sep {
			color: #cbd5e1;
			font-size: 0.7rem;
			user-select: none;
		}

		.page-footer-hint {
			margin: 0;
			color: var(--muted);
			font-size: 0.75rem;
		}

		.page-footer-hint kbd {
			font-family: inherit;
			font-size: 0.68rem;
			font-weight: 600;
			background: var(--chip);
			border: 1px solid var(--line);
			border-radius: 4px;
			padding: 1px 5px;
		}

		@media (max-width: 820px) {
			.brand span,
			.back-link span {
				display: none;
			}

			.size-control {
				min-width: 110px;
			}

			.size-control input[type="range"] {
				width: 72px;
			}

			.workspace {
				padding: 8px;
			}

			.paper {
				border-radius: 12px;
			}
		}

		@media (max-width: 560px) {
			.topbar {
				flex-wrap: wrap;
				gap: 8px;
				padding-left: 10px;
				padding-right: 10px;
			}

			.tools {
				order: 3;
				flex: 1 1 100%;
			}

			.actions {
				margin-left: auto;
			}

			.btn {
				width: 34px;
				height: 34px;
			}

			.back-link {
				display: none;
			}

			.size-control {
				min-width: 108px;
			}

			.size-control input[type="range"] {
				width: 64px;
			}

			.swatch {
				width: 20px;
				height: 20px;
			}

			.page-footer-hint {
				display: none;
			}
		}
	</style>
	<script src="/new/js/site-analytics-loader.js"></script>
</head>

<body>
	<div class="app">
		<header class="topbar">
			<a class="brand" href="index.html" title="Back to portfolio">
				<img src="images/smiling.png" alt="">
				<span>Board</span>
			</a>

			<div class="tools">
				<div class="cluster" role="group" aria-label="Drawing tools">
					<button class="btn active" id="pen-tool" type="button" title="Pen (P)">
						<i class="fas fa-pen" aria-hidden="true"></i>
					</button>
					<button class="btn" id="eraser-tool" type="button" title="Eraser (E)">
						<i class="fas fa-eraser" aria-hidden="true"></i>
					</button>
				</div>

				<div class="cluster" aria-label="Brush size">
					<div class="size-control">
						<input type="range" id="brush-size" min="1" max="40" value="5" aria-label="Brush size">
						<span class="size-preview" id="size-preview" aria-hidden="true"></span>
						<span class="size-value" id="size-value">5</span>
					</div>
				</div>

				<div class="cluster" role="group" aria-label="Colors">
					<div class="swatches">
						<button type="button" class="swatch active" data-color="#0f172a" style="--swatch:#0f172a" title="Ink"></button>
						<button type="button" class="swatch" data-color="#64748b" style="--swatch:#64748b" title="Slate"></button>
						<button type="button" class="swatch" data-color="#dc2626" style="--swatch:#dc2626" title="Red"></button>
						<button type="button" class="swatch" data-color="#ea580c" style="--swatch:#ea580c" title="Orange"></button>
						<button type="button" class="swatch" data-color="#ca8a04" style="--swatch:#ca8a04" title="Gold"></button>
						<button type="button" class="swatch" data-color="#16a34a" style="--swatch:#16a34a" title="Green"></button>
						<button type="button" class="swatch" data-color="#2563eb" style="--swatch:#2563eb" title="Blue"></button>
						<button type="button" class="swatch" data-color="#7c3aed" style="--swatch:#7c3aed" title="Violet"></button>
						<button type="button" class="swatch light" data-color="#ffffff" style="--swatch:#ffffff" title="White"></button>
						<label class="swatch custom" title="Custom color">
							<input type="color" id="color-picker" value="#0f172a" aria-label="Custom color">
						</label>
					</div>
				</div>
			</div>

			<div class="actions">
				<div class="cluster">
					<button class="btn" id="undo-btn" type="button" title="Undo (⌘Z)" disabled>
						<i class="fas fa-undo" aria-hidden="true"></i>
					</button>
					<button class="btn" id="redo-btn" type="button" title="Redo (⌘⇧Z)" disabled>
						<i class="fas fa-redo" aria-hidden="true"></i>
					</button>
					<button class="btn" id="download-btn" type="button" title="Download PNG">
						<i class="fas fa-download" aria-hidden="true"></i>
					</button>
					<button class="btn danger" id="clear-btn" type="button" title="Clear canvas">
						<i class="fas fa-trash" aria-hidden="true"></i>
					</button>
				</div>
				<a class="back-link" href="index.html"><i class="fas fa-arrow-left" aria-hidden="true"></i> <span>Portfolio</span></a>
			</div>
		</header>

		<main class="workspace">
			<div class="paper">
				<canvas id="drawingCanvas" width="1200" height="800"></canvas>
			</div>
		</main>

		<footer class="page-footer">
			<div class="page-footer-inner">
				<nav class="page-footer-nav" aria-label="Site links">
					<a href="tools.html"><i class="fas fa-tools" aria-hidden="true"></i> More Tools</a>
					<span class="sep" aria-hidden="true">·</span>

					<a href="/halal-vibes">Halal Vibes</a> -->
					<span class="sep" aria-hidden="true">·</span>
					<a href="https://ymorsi7.github.io/Ayatica/" target="_blank" rel="noopener noreferrer">Ayatica</a>
					<span class="sep" aria-hidden="true">·</span>
					<a href="https://bidetbud.com" target="_blank" rel="noopener noreferrer">bidetbud.com</a>
					<span class="sep" aria-hidden="true">·</span>
					<a href="UCSD-Tier-List/index.html"><i class="fa-solid fa-list" aria-hidden="true"></i> UCSD Tier
						List</a>
					<span class="sep" aria-hidden="true">·</span>
					<a class="github-star-footer" href="https://github.com/ymorsi7/ymorsi7.github.io" target="_blank"
						rel="noopener noreferrer" aria-label="Star on GitHub"><i class="fa-brands fa-github"
							aria-hidden="true"></i><span>Star</span></a>
				</nav>
				<p class="page-footer-hint">Draw to start <kbd>P</kbd> pen <kbd>E</kbd> eraser <kbd>⌘Z</kbd> undo</p>
			</div>
		</footer>
	</div>

	<script>
		const canvas = document.getElementById('drawingCanvas');
		const ctx = canvas.getContext('2d');
		const paper = canvas.parentElement;
		const penBtn = document.getElementById('pen-tool');
		const eraserBtn = document.getElementById('eraser-tool');
		const colorPicker = document.getElementById('color-picker');
		const sizeInput = document.getElementById('brush-size');
		const sizeValue = document.getElementById('size-value');
		const sizePreview = document.getElementById('size-preview');
		const undoBtn = document.getElementById('undo-btn');
		const redoBtn = document.getElementById('redo-btn');
		const clearBtn = document.getElementById('clear-btn');
		const swatches = Array.from(document.querySelectorAll('.swatch[data-color]'));

		let isDrawing = false;
		let currentTool = 'pen';
		let currentColor = '#0f172a';
		let brushSize = 5;
		let history = [];
		let historyStep = -1;
		let clearArmed = false;
		let clearTimer = null;
		let skipSave = false;

		function cssSize() {
			return {
				width: Math.max(1, Math.floor(paper.clientWidth)),
				height: Math.max(1, Math.floor(paper.clientHeight))
			};
		}

		function fillWhite() {
			ctx.save();
			ctx.setTransform(1, 0, 0, 1, 0, 0);
			ctx.fillStyle = '#ffffff';
			ctx.fillRect(0, 0, canvas.width, canvas.height);
			ctx.restore();
		}

		function snapshot() {
			return canvas.toDataURL();
		}

		function restore(dataUrl, thenSave) {
			const img = new Image();
			img.onload = () => {
				fillWhite();
				ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
				if (thenSave) saveState();
			};
			img.src = dataUrl;
		}

		function fitCanvas(keepDrawing) {
			const { width, height } = cssSize();
			if (canvas.width === width && canvas.height === height) return;
			let backup = null;
			if (keepDrawing && canvas.width > 1 && canvas.height > 1) {
				backup = document.createElement('canvas');
				backup.width = canvas.width;
				backup.height = canvas.height;
				backup.getContext('2d').drawImage(canvas, 0, 0);
			}
			canvas.width = width;
			canvas.height = height;
			fillWhite();
			if (backup) ctx.drawImage(backup, 0, 0, width, height);
		}

		function saveState() {
			if (skipSave) return;
			historyStep++;
			if (historyStep < history.length) history.length = historyStep;
			history.push(snapshot());
			if (history.length > 40) {
				history.shift();
				historyStep--;
			}
			syncHistoryButtons();
		}

		function syncHistoryButtons() {
			undoBtn.disabled = historyStep <= 0;
			redoBtn.disabled = historyStep >= history.length - 1;
		}

		function setTool(tool) {
			currentTool = tool;
			penBtn.classList.toggle('active', tool === 'pen');
			eraserBtn.classList.toggle('active', tool === 'eraser');
			canvas.style.cursor = tool === 'eraser' ? 'cell' : 'crosshair';
		}

		function setColor(color, fromPicker) {
			currentColor = color;
			if (!fromPicker) colorPicker.value = color.length === 7 ? color : '#0f172a';
			swatches.forEach((swatch) => {
				swatch.classList.toggle('active', swatch.dataset.color.toLowerCase() === color.toLowerCase());
			});
			sizePreview.style.background = color;
		}

		function setSize(value) {
			brushSize = Math.max(1, Math.min(40, parseInt(value, 10) || 5));
			sizeInput.value = brushSize;
			sizeValue.textContent = brushSize;
			const scale = 0.7 + (brushSize / 40) * 1.3;
			sizePreview.style.setProperty('--brush-scale', String(scale));
		}

		function getPos(e) {
			const rect = canvas.getBoundingClientRect();
			const point = e.touches && e.touches[0] ? e.touches[0] : e;
			const x = (point.clientX - rect.left) * (canvas.width / rect.width);
			const y = (point.clientY - rect.top) * (canvas.height / rect.height);
			return { x, y };
		}

		function startDrawing(e) {
			if (e.button !== undefined && e.button !== 0) return;
			isDrawing = true;
			const pos = getPos(e);
			ctx.beginPath();
			ctx.moveTo(pos.x, pos.y);
			draw(e);
		}

		function draw(e) {
			if (!isDrawing) return;
			const pos = getPos(e);
			ctx.strokeStyle = currentTool === 'eraser' ? '#ffffff' : currentColor;
			ctx.lineWidth = currentTool === 'eraser' ? brushSize * 2 : brushSize;
			ctx.lineCap = 'round';
			ctx.lineJoin = 'round';
			ctx.lineTo(pos.x, pos.y);
			ctx.stroke();
		}

		function stopDrawing() {
			if (!isDrawing) return;
			isDrawing = false;
			ctx.beginPath();
			saveState();
		}

		function undo() {
			if (historyStep <= 0) return;
			historyStep--;
			restore(history[historyStep]);
			syncHistoryButtons();
		}

		function redo() {
			if (historyStep >= history.length - 1) return;
			historyStep++;
			restore(history[historyStep]);
			syncHistoryButtons();
		}

		function clearCanvas() {
			if (!clearArmed) {
				clearArmed = true;
				clearBtn.classList.add('armed');
				clearBtn.innerHTML = 'Clear?';
				clearTimer = setTimeout(resetClear, 2500);
				return;
			}
			resetClear();
			fillWhite();
			saveState();
		}

		function resetClear() {
			clearArmed = false;
			clearBtn.classList.remove('armed');
			clearBtn.innerHTML = '<i class="fas fa-trash" aria-hidden="true"></i>';
			if (clearTimer) clearTimeout(clearTimer);
		}

		penBtn.addEventListener('click', () => setTool('pen'));
		eraserBtn.addEventListener('click', () => setTool('eraser'));
		swatches.forEach((swatch) => {
			swatch.addEventListener('click', () => setColor(swatch.dataset.color));
		});
		colorPicker.addEventListener('input', (e) => {
			swatches.forEach((swatch) => swatch.classList.remove('active'));
			setColor(e.target.value, true);
		});
		sizeInput.addEventListener('input', (e) => setSize(e.target.value));
		undoBtn.addEventListener('click', undo);
		redoBtn.addEventListener('click', redo);
		clearBtn.addEventListener('click', clearCanvas);
		document.getElementById('download-btn').addEventListener('click', () => {
			const link = document.createElement('a');
			link.download = 'drawing.png';
			link.href = snapshot();
			link.click();
		});

		canvas.addEventListener('mousedown', startDrawing);
		canvas.addEventListener('mousemove', draw);
		window.addEventListener('mouseup', stopDrawing);
		canvas.addEventListener('mouseleave', stopDrawing);

		canvas.addEventListener('touchstart', (e) => {
			e.preventDefault();
			startDrawing(e);
		}, { passive: false });
		canvas.addEventListener('touchmove', (e) => {
			e.preventDefault();
			draw(e);
		}, { passive: false });
		canvas.addEventListener('touchend', (e) => {
			e.preventDefault();
			stopDrawing();
		});
		canvas.addEventListener('touchcancel', stopDrawing);

		window.addEventListener('keydown', (e) => {
			const key = e.key.toLowerCase();
			const meta = e.metaKey || e.ctrlKey;
			if (meta && key === 'z') {
				e.preventDefault();
				if (e.shiftKey) redo();
				else undo();
			} else if (meta && key === 'y') {
				e.preventDefault();
				redo();
			} else if (key === 'p' || key === 'b') {
				setTool('pen');
			} else if (key === 'e') {
				setTool('eraser');
			}
		});

		function boot(keepDrawing) {
			fitCanvas(keepDrawing);
		}

		setSize(5);
		setColor('#0f172a');
		setTool('pen');
		boot(false);
		saveState();

		if (typeof ResizeObserver !== 'undefined') {
			new ResizeObserver(() => boot(true)).observe(paper);
		}
		window.addEventListener('resize', () => boot(true));
		window.addEventListener('load', () => boot(true));
	</script>
</body>

</html>
