<!DOCTYPE HTML>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<title>MergePDF - Merge PDFs and Images</title>
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="description" content="Merge multiple PDFs and images into one PDF file" />
	<meta name="keywords" content="pdf merger, merge pdf, merge images, pdf tool" />
	<meta name="author" content="Yusuf Morsi" />

	<link rel="icon" type="image/svg+xml"
		href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='16' fill='%230f172a'/%3E%3Crect x='28' y='22' width='44' height='56' rx='6' fill='none' stroke='white' stroke-width='5'/%3E%3Cpath d='M38 40 H62 M38 52 H54' stroke='%2394a3b8' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">

	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
	<link rel="stylesheet" href="/new/css/github-star.css">

	<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		:root {
			--ink: #0f172a;
			--muted: #64748b;
			--line: rgba(15, 23, 42, 0.08);
			--paper: #ffffff;
			--stage: #e8edf3;
			--chip: #f8fafc;
			--chip-hover: #eef2f7;
			--danger: #dc2626;
			--blue-primary: #334155;
			--blue-hover: #0f172a;
			--blue-light: #64748b;
			--shadow: 0 10px 40px rgba(15, 23, 42, 0.08);
			--safe-top: env(safe-area-inset-top);
			--safe-bottom: env(safe-area-inset-bottom);
		}

		html,
		body {
			min-height: 100%;
		}

		body {
			font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			background:
				radial-gradient(circle at 1px 1px, rgba(15, 23, 42, 0.06) 1px, transparent 0) 0 0 / 22px 22px,
				var(--stage);
			color: var(--ink);
			line-height: 1.5;
		}

		.app {
			min-height: 100vh;
			display: flex;
			flex-direction: column;
		}

		.topbar {
			flex-shrink: 0;
			display: flex;
			align-items: center;
			gap: 12px;
			padding: calc(10px + var(--safe-top)) 16px 10px;
			background: rgba(255, 255, 255, 0.82);
			backdrop-filter: blur(16px);
			-webkit-backdrop-filter: blur(16px);
			border-bottom: 1px solid var(--line);
			position: sticky;
			top: 0;
			z-index: 10;
		}

		.brand {
			display: inline-flex;
			align-items: center;
			gap: 10px;
			text-decoration: none;
			color: var(--ink);
			padding: 4px 8px 4px 4px;
			border-radius: 999px;
		}

		.brand:hover {
			background: var(--chip-hover);
		}

		.brand img {
			width: 32px;
			height: 32px;
			border-radius: 50%;
			object-fit: cover;
		}

		.brand span {
			font-weight: 600;
			font-size: 0.95rem;
			letter-spacing: -0.02em;
		}

		.topbar-spacer {
			flex: 1;
		}

		.back-link {
			display: inline-flex;
			align-items: center;
			gap: 6px;
			color: var(--muted);
			text-decoration: none;
			font-size: 0.82rem;
			font-weight: 500;
			padding: 8px 10px;
			border-radius: 10px;
			white-space: nowrap;
		}

		.back-link:hover {
			background: var(--chip-hover);
			color: var(--ink);
		}

		.main-content {
			flex: 1;
			width: min(720px, calc(100% - 32px));
			margin: 28px auto 0;
			padding-bottom: 24px;
		}

		#alert-container {
			margin-bottom: 14px;
			min-height: 0;
		}

		.alert {
			padding: 12px 14px;
			border-radius: 12px;
			margin-bottom: 10px;
			display: none;
			font-size: 0.9rem;
			border: 1px solid;
		}

		.alert.show {
			display: block;
		}

		.alert-success {
			background: #ecfdf5;
			color: #065f46;
			border-color: #a7f3d0;
		}

		.alert-error {
			background: #fef2f2;
			color: #991b1b;
			border-color: #fecaca;
		}

		.alert-info {
			background: #f8fafc;
			color: #334155;
			border-color: var(--line);
		}

		.upload-card,
		.files-card {
			background: var(--paper);
			border-radius: 20px;
			box-shadow: var(--shadow);
			border: 1px solid var(--line);
			margin-bottom: 16px;
		}

		.drop-zone {
			padding: 48px 28px;
			text-align: center;
			cursor: pointer;
			position: relative;
			border-radius: 20px;
			transition: background 0.15s ease;
		}

		.drop-zone::before {
			content: '';
			position: absolute;
			inset: 12px;
			border: 1.5px dashed #cbd5e1;
			border-radius: 14px;
			pointer-events: none;
			transition: border-color 0.15s ease;
		}

		.drop-zone:hover,
		.drop-zone.drag-over {
			background: #f8fafc;
		}

		.drop-zone.drag-over::before {
			border-color: var(--ink);
			border-style: solid;
		}

		.upload-icon {
			width: 56px;
			height: 56px;
			margin: 0 auto 16px;
			border-radius: 16px;
			background: var(--chip);
			color: var(--ink);
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 1.4rem;
		}

		.drop-zone h2 {
			font-size: 1.35rem;
			font-weight: 600;
			letter-spacing: -0.02em;
			margin-bottom: 6px;
		}

		.drop-zone p {
			color: var(--muted);
			font-size: 0.95rem;
			margin-bottom: 22px;
		}

		.file-input {
			position: absolute;
			width: 0;
			height: 0;
			opacity: 0;
			pointer-events: none;
		}

		.btn-primary,
		.btn-merge {
			background: var(--ink);
			color: white;
			border: 0;
			border-radius: 12px;
			padding: 12px 18px;
			font-size: 0.95rem;
			font-weight: 600;
			font-family: inherit;
			cursor: pointer;
			display: inline-flex;
			align-items: center;
			gap: 8px;
		}

		.btn-primary:hover,
		.btn-merge:hover:not(:disabled) {
			background: #1e293b;
		}

		.btn-merge:disabled {
			opacity: 0.55;
			cursor: not-allowed;
		}

		.files-card {
			display: none;
			padding: 22px;
		}

		.files-card.show {
			display: block;
		}

		.files-card h3 {
			font-size: 0.95rem;
			font-weight: 600;
			margin-bottom: 14px;
			display: flex;
			align-items: center;
			gap: 8px;
			color: var(--ink);
		}

		.files-card h3 i {
			color: var(--muted);
		}

		#fileList {
			margin-bottom: 16px;
		}

		.file-item {
			background: var(--chip);
			border-radius: 14px;
			padding: 12px 14px;
			margin-bottom: 8px;
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 12px;
			border: 1px solid transparent;
		}

		.file-item:hover {
			border-color: var(--line);
			background: #fff;
		}

		.file-info {
			flex: 1;
			display: flex;
			align-items: center;
			gap: 12px;
			min-width: 0;
		}

		.file-icon-wrapper {
			width: 40px;
			height: 40px;
			border-radius: 10px;
			background: var(--ink);
			display: flex;
			align-items: center;
			justify-content: center;
			flex-shrink: 0;
		}

		.file-icon-wrapper i {
			font-size: 1rem;
			color: white;
		}

		.file-details {
			min-width: 0;
			flex: 1;
		}

		.file-details h4 {
			font-size: 0.95rem;
			font-weight: 600;
			overflow: hidden;
			text-overflow: ellipsis;
			white-space: nowrap;
		}

		.file-details span {
			font-size: 0.78rem;
			color: var(--muted);
		}

		.file-actions {
			display: flex;
			gap: 6px;
			flex-shrink: 0;
		}

		.btn-action {
			width: 34px;
			height: 34px;
			border-radius: 9px;
			border: 1px solid var(--line);
			background: white;
			color: var(--muted);
			cursor: pointer;
			display: flex;
			align-items: center;
			justify-content: center;
		}

		.btn-action:hover:not(:disabled) {
			background: var(--ink);
			border-color: var(--ink);
			color: white;
		}

		.btn-action:disabled {
			opacity: 0.35;
			cursor: not-allowed;
		}

		.btn-remove:hover:not(:disabled) {
			background: var(--danger);
			border-color: var(--danger);
			color: white;
		}

		.merge-section {
			padding-top: 14px;
			border-top: 1px solid var(--line);
			text-align: right;
		}

		.spinner {
			border: 2px solid rgba(255, 255, 255, 0.3);
			border-top: 2px solid white;
			border-radius: 50%;
			width: 16px;
			height: 16px;
			animation: spin 0.8s linear infinite;
			display: inline-block;
		}

		@keyframes spin {
			to { transform: rotate(360deg); }
		}

		.page-footer {
			margin-top: auto;
			padding: 8px 16px calc(12px + var(--safe-bottom));
		}

		.footer-content,
		.page-footer-nav {
			display: flex;
			flex-wrap: wrap;
			align-items: center;
			justify-content: center;
			gap: 2px 4px;
		}

		.footer-content a,
		.page-footer-nav a {
			display: inline-flex;
			align-items: center;
			gap: 0.35rem;
			color: var(--muted);
			text-decoration: none;
			font-weight: 500;
			font-size: 0.78rem;
			padding: 0.28rem 0.5rem;
			border-radius: 8px;
		}

		.footer-content a:hover,
		.page-footer-nav a:hover {
			color: var(--ink);
			background: rgba(255, 255, 255, 0.7);
		}

		.footer-content span {
			display: none;
		}

		@media (max-width: 640px) {
			.drop-zone {
				padding: 36px 18px;
			}

			.merge-section,
			.file-actions {
				text-align: center;
			}

			.btn-merge,
			.btn-primary {
				width: 100%;
				justify-content: center;
			}

			.file-item {
				flex-wrap: wrap;
			}

			.file-actions {
				width: 100%;
				justify-content: flex-end;
			}

			.back-link span {
				display: none;
			}
		}
	</style>
	<script src="/new/js/site-analytics-loader.js"></script>
</head>

<body>
	<div class="app">
		<header class="topbar">
			<a class="brand" href="index.html" title="Back to portfolio">
				<img src="images/smiling.png" alt="">
				<span>MergePDF</span>
			</a>
			<div class="topbar-spacer"></div>
			<a class="back-link" href="index.html"><i class="fas fa-arrow-left" aria-hidden="true"></i> <span>Portfolio</span></a>
		</header>

		<div class="main-content">
			<div id="alert-container"></div>

			<div class="upload-card">
				<div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
					<div class="upload-icon"><i class="fas fa-file-arrow-up"></i></div>
					<h2>Drop files to merge</h2>
					<p>PDFs and images · JPG, PNG, GIF, BMP, WEBP</p>
					<button class="btn-primary" type="button" onclick="event.stopPropagation(); document.getElementById('fileInput').click();">
						<i class="fas fa-folder-open"></i> Choose files
					</button>
					<input type="file" id="fileInput" class="file-input" multiple accept=".pdf,.jpg,.jpeg,.png,.gif,.bmp,.webp">
				</div>
			</div>

			<div class="files-card" id="fileListContainer">
				<h3>
					<i class="fas fa-layer-group"></i> Files in order
				</h3>
				<div id="fileList"></div>
				<div class="merge-section">
					<button class="btn-merge" id="mergeBtn" onclick="mergeFiles()">
						<i class="fas fa-file-pdf"></i> Merge files
					</button>
				</div>
			</div>
		</div>

		<footer class="page-footer">
			<div class="footer-content">
				<a href="tools.html"><i class="fas fa-tools"></i> More Tools</a>
				<a href="old/photography.html" target="_blank" rel="noopener">Photography</a>
				<!-- <a href="/halal-vibes">Halal Vibes</a> -->
				<a href="https://ymorsi7.github.io/Ayatica/" target="_blank" rel="noopener noreferrer">Ayatica</a>
				<a href="https://bidetbud.com" target="_blank" rel="noopener noreferrer">bidetbud.com</a>
				<a href="UCSD-Tier-List/index.html"><i class="fa-solid fa-list"></i> UCSD Tier List</a>
				<a class="github-star-footer" href="https://github.com/ymorsi7/ymorsi7.github.io" target="_blank" rel="noopener noreferrer" aria-label="Star on GitHub"><i class="fa-brands fa-github" aria-hidden="true"></i><span>Star</span></a>
			</div>
		</footer>
	</div>

	<script src="MergePDF/mergepdf.js"></script>
</body>

</html>
