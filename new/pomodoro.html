<!DOCTYPE HTML>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<title>Pomodoro Timer - Focus & Productivity</title>
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="description" content="Free Pomodoro timer for better focus and productivity" />
	<meta name="keywords" content="pomodoro timer, focus timer, productivity, study timer" />
	<meta name="author" content="Yusuf Morsi" />

	<link rel="icon" type="image/svg+xml"
		href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='16' fill='%230f172a'/%3E%3Ccircle cx='50' cy='50' r='28' fill='none' stroke='white' stroke-width='6'/%3E%3Cpath d='M50 32 V50 L62 58' fill='none' stroke='%2394a3b8' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">

	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
	<link rel="stylesheet" href="/new/css/github-star.css">

	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		:root {
			--ink: #0f172a;
			--muted: #64748b;
			--line: rgba(15, 23, 42, 0.08);
			--paper: #ffffff;
			--stage: #e8edf3;
			--chip: #f8fafc;
			--chip-hover: #eef2f7;
			--danger: #dc2626;
			--focus: #0f172a;
			--break: #0f766e;
			--blue-primary: #334155;
			--blue-hover: #0f172a;
			--green: #0f766e;
			--red: #dc2626;
			--text-medium: #64748b;
			--shadow: 0 10px 40px rgba(15, 23, 42, 0.08);
			--safe-top: env(safe-area-inset-top);
			--safe-bottom: env(safe-area-inset-bottom);
		}

		html,
		body {
			min-height: 100%;
		}

		body {
			font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			background: var(--stage);
			color: var(--ink);
			transition: background 0.35s ease;
		}

		body.is-break {
			background: #e7f0ee;
		}

		body.is-flash {
			background: #fecaca !important;
		}

		.app {
			min-height: 100vh;
			display: flex;
			flex-direction: column;
		}

		.topbar {
			flex-shrink: 0;
			display: flex;
			align-items: center;
			gap: 12px;
			padding: calc(10px + var(--safe-top)) 16px 10px;
			background: rgba(255, 255, 255, 0.82);
			backdrop-filter: blur(16px);
			-webkit-backdrop-filter: blur(16px);
			border-bottom: 1px solid var(--line);
		}

		.brand {
			display: inline-flex;
			align-items: center;
			gap: 10px;
			text-decoration: none;
			color: var(--ink);
			padding: 4px 8px 4px 4px;
			border-radius: 999px;
		}

		.brand:hover {
			background: var(--chip-hover);
		}

		.brand img {
			width: 32px;
			height: 32px;
			border-radius: 50%;
			object-fit: cover;
		}

		.brand span {
			font-weight: 600;
			font-size: 0.95rem;
			letter-spacing: -0.02em;
		}

		.topbar-spacer {
			flex: 1;
		}

		.icon-btn {
			width: 38px;
			height: 38px;
			border: 1px solid var(--line);
			background: var(--chip);
			border-radius: 10px;
			color: var(--ink);
			cursor: pointer;
			display: inline-flex;
			align-items: center;
			justify-content: center;
		}

		.icon-btn:hover,
		.back-link:hover {
			background: var(--chip-hover);
		}

		.back-link {
			display: inline-flex;
			align-items: center;
			gap: 6px;
			color: var(--muted);
			text-decoration: none;
			font-size: 0.82rem;
			font-weight: 500;
			padding: 8px 10px;
			border-radius: 10px;
			white-space: nowrap;
		}

		.stage {
			flex: 1;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 32px 16px 24px;
		}

		.card {
			width: 100%;
			max-width: 460px;
			background: var(--paper);
			border-radius: 24px;
			box-shadow: var(--shadow);
			padding: 36px 32px 28px;
			text-align: center;
		}

		.mode-indicator {
			display: inline-flex;
			align-items: center;
			gap: 8px;
			padding: 6px 12px;
			border-radius: 999px;
			background: var(--chip);
			color: var(--muted);
			font-size: 0.8rem;
			font-weight: 600;
			letter-spacing: 0.04em;
			text-transform: uppercase;
		}

		.mode-indicator.work {
			color: var(--ink);
		}

		.mode-indicator.break {
			color: var(--break);
			background: #ecfdf8;
		}

		.timer-wrap {
			position: relative;
			width: min(280px, 70vw);
			margin: 28px auto 8px;
		}

		.timer-wrap svg {
			width: 100%;
			height: auto;
			transform: rotate(-90deg);
		}

		.ring-track {
			fill: none;
			stroke: #eef2f7;
			stroke-width: 6;
		}

		.progress-fill {
			fill: none;
			stroke: var(--focus);
			stroke-width: 6;
			stroke-linecap: round;
			stroke-dasharray: 0 100;
			transition: stroke-dasharray 0.4s ease, stroke 0.3s ease;
		}

		.progress-fill.break {
			stroke: var(--break);
		}

		.timer-display {
			position: absolute;
			inset: 0;
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: clamp(2.8rem, 10vw, 3.6rem);
			font-weight: 700;
			letter-spacing: -0.04em;
			font-variant-numeric: tabular-nums;
			color: var(--ink);
		}

		.controls {
			display: flex;
			justify-content: center;
			gap: 10px;
			margin: 22px 0 8px;
		}

		.btn {
			border: 0;
			border-radius: 12px;
			padding: 12px 18px;
			font-size: 0.95rem;
			font-weight: 600;
			font-family: inherit;
			cursor: pointer;
			display: inline-flex;
			align-items: center;
			gap: 8px;
			transition: background 0.15s ease, transform 0.15s ease;
		}

		.btn:active {
			transform: scale(0.98);
		}

		.btn-primary {
			background: var(--ink);
			color: #fff;
			min-width: 132px;
			justify-content: center;
		}

		.btn-primary:hover {
			background: #1e293b;
		}

		body.is-break .btn-primary {
			background: var(--break);
		}

		.btn-secondary,
		.btn-danger {
			background: var(--chip);
			color: var(--ink);
			border: 1px solid var(--line);
		}

		.btn-secondary:hover,
		.btn-danger:hover {
			background: var(--chip-hover);
		}

		.btn-danger:hover {
			color: var(--danger);
		}

		.settings {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 10px;
			margin-top: 22px;
			padding-top: 18px;
			border-top: 1px solid var(--line);
		}

		.setting-item {
			text-align: left;
			background: var(--chip);
			border: 1px solid var(--line);
			border-radius: 14px;
			padding: 12px 14px;
		}

		.setting-item label {
			display: block;
			font-size: 0.72rem;
			font-weight: 600;
			letter-spacing: 0.04em;
			text-transform: uppercase;
			color: var(--muted);
			margin-bottom: 6px;
		}

		.setting-item input {
			width: 100%;
			border: 0;
			background: transparent;
			font: inherit;
			font-size: 1.35rem;
			font-weight: 700;
			color: var(--ink);
			font-variant-numeric: tabular-nums;
		}

		.setting-item input:focus {
			outline: none;
		}

		.notify {
			margin-top: 14px;
			font-size: 0.78rem;
			color: var(--muted);
			min-height: 1.2em;
		}

		.page-footer {
			padding: 8px 16px calc(12px + var(--safe-bottom));
		}

		.page-footer-nav {
			display: flex;
			flex-wrap: wrap;
			justify-content: center;
			align-items: center;
			gap: 2px 4px;
		}

		.page-footer-nav a {
			display: inline-flex;
			align-items: center;
			gap: 0.35rem;
			color: var(--muted);
			text-decoration: none;
			font-weight: 500;
			font-size: 0.78rem;
			padding: 0.28rem 0.5rem;
			border-radius: 8px;
		}

		.page-footer-nav a:hover {
			color: var(--ink);
			background: var(--chip-hover);
		}

		@media (max-width: 560px) {
			.card {
				padding: 28px 20px 22px;
			}

			.back-link span {
				display: none;
			}
		}
	</style>
	<script src="/new/js/site-analytics-loader.js"></script>
</head>

<body>
	<div class="app">
		<header class="topbar">
			<a class="brand" href="index.html" title="Back to portfolio">
				<img src="images/smiling.png" alt="">
				<span>Focus</span>
			</a>
			<div class="topbar-spacer"></div>
			<button class="icon-btn" id="test-notification-btn" type="button" title="Test notifications">
				<i class="fas fa-bell" aria-hidden="true"></i>
			</button>
			<a class="back-link" href="index.html"><i class="fas fa-arrow-left" aria-hidden="true"></i> <span>Portfolio</span></a>

		<main class="stage">
			<div class="card">
				<div class="mode-indicator work" id="mode-indicator">Work session</div>

				<div class="timer-wrap">
					<svg viewBox="0 0 100 100" aria-hidden="true">
						<circle class="ring-track" cx="50" cy="50" r="42"></circle>
						<circle class="progress-fill" id="progress" cx="50" cy="50" r="42" pathLength="100"></circle>

					<div class="timer-display" id="timer">50:00</div>
				</div>

				<div class="controls">
					<button class="btn btn-primary" id="start-btn" type="button">

					</button>

						<i class="fas fa-pause"></i> Pause
					</button>

						<i class="fas fa-undo"></i> Reset
					</button>

				<div class="settings">
					<div class="setting-item">
						<label for="work-duration">Focus (min)</label>
						<input type="number" id="work-duration" value="50" min="1" max="120">
					</div>
					<div class="setting-item">
						<label for="break-duration">Break (min)</label>
						<input type="number" id="break-duration" value="10" min="1" max="60">

			</nav>
		</footer>

	<script>
		let timerInterval = null;
		let timeLeft = 50 * 60;
		let isRunning = false;
		let isWorkMode = true;
		let workDuration = 50;
		let breakDuration = 10;
		let totalTime = 50 * 60;

		const timerDisplay = document.getElementById('timer');
		const modeIndicator = document.getElementById('mode-indicator');
		const progressBar = document.getElementById('progress');
		const startBtn = document.getElementById('start-btn');
		const pauseBtn = document.getElementById('pause-btn');
		const resetBtn = document.getElementById('reset-btn');
		const workInput = document.getElementById('work-duration');
		const breakInput = document.getElementById('break-duration');
		let alarmInterval = null;
		let endTime = null;
		let alarmActive = false;
		let notificationInterval = null;

		const notificationStatusText = document.getElementById('notification-status-text');
		const testNotificationBtn = document.getElementById('test-notification-btn');

		function setBreakMode(on) {
			document.body.classList.toggle('is-break', on);
		}

		function updateNotificationStatus() {
			if (!('Notification' in window)) {
				notificationStatusText.textContent = 'Notifications not supported in this browser';
				return;
			}

			const permission = Notification.permission;
			if (permission === 'granted') {
				notificationStatusText.textContent = 'Notifications on';
			} else if (permission === 'denied') {
				notificationStatusText.textContent = 'Notifications blocked — enable them in browser settings';
			} else {
				notificationStatusText.textContent = 'Tap the bell to enable notifications';
			}
		}

		if ('Notification' in window && Notification.permission === 'default') {
			Notification.requestPermission().then(() => updateNotificationStatus());
		}

		testNotificationBtn.addEventListener('click', async () => {
			if (!('Notification' in window)) {
				alert('Notifications are not supported in this browser.');
				return;
			}

			let permission = Notification.permission;
			if (permission === 'default') {
				permission = await Notification.requestPermission();
			}

			updateNotificationStatus();

			if (permission === 'granted') {
				const notification = new Notification('Test notification', {
					body: 'If you see this, notifications are working.',
					icon: 'images/smiling.png',
					tag: 'test',
					requireInteraction: true,
					silent: false
				});

				try {
					const audio = new Audio('data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAoUXrTp66hVFApGn+DyvmwhBSuBzvLZiTYIGWi77+efTRAMUKfj8LZjHAY4kdfyzHksBSR3x/DdkEAKFF606euoVRQKRp/g8r5sIQUrgc7y2Yk2CBlo');
					audio.volume = 1.0;
					audio.play().catch(err => {
						console.error('Failed to play test alarm:', err);
						alert('Audio test failed. Make sure your browser allows audio and the tab is not muted.');
					});
				} catch (e) {
					console.error('Error creating test audio:', e);
				}

				setTimeout(() => notification.close(), 5000);
			} else if (permission === 'denied') {
				alert('Notifications are blocked. Please enable them in your browser settings for this site.');
			}
		});

		function showNotification(title, body) {
			if (!('Notification' in window)) {
				alert(`${title}\n${body}`);
				return;
			}

			if (Notification.permission === 'granted') {
				try {
					const showOne = () => {
						try {
							const notification = new Notification(title, {
								body: body,
								icon: 'images/smiling.png',
								badge: 'images/smiling.png',
								tag: 'pomodoro-timer',
								requireInteraction: true,
								silent: false
							});

							setTimeout(() => notification.close(), 30000);

							notification.onclick = () => {
								window.focus();
								notification.close();
								if (notificationInterval) {
									clearInterval(notificationInterval);
									notificationInterval = null;
								}
							};
						} catch (e) {
							alert(`${title}\n${body}`);
						}
					};

					showOne();

					if (!notificationInterval) {
						notificationInterval = setInterval(() => {
							if (alarmActive) {
								showOne();
							} else {
								clearInterval(notificationInterval);
								notificationInterval = null;
							}
						}, 5000);
					}
				} catch (e) {
					alert(`${title}\n${body}`);
				}
			} else if (Notification.permission === 'default') {
				Notification.requestPermission().then(permission => {
					updateNotificationStatus();
					if (permission === 'granted') {
						showNotification(title, body);
					} else {
						alert(`${title}\n${body}`);
					}
				});
			} else {
				alert(`${title}\n${body}`);
			}
		}

		updateNotificationStatus();

		function playAlarm() {
			alarmActive = true;

			if (alarmInterval) {
				clearInterval(alarmInterval);
			}

			const playBeep = () => {
				try {
					const audio = new Audio('data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAoUXrTp66hVFApGn+DyvmwhBSuBzvLZiTYIGWi77+efTRAMUKfj8LZjHAY4kdfyzHksBSR3x/DdkEAKFF606euoVRQKRp/g8r5sIQUrgc7y2Yk2CBlo');
					audio.volume = 1.0;
					audio.play().catch(() => {});
				} catch (e) {}
			};

			let beepCount = 0;
			alarmInterval = setInterval(() => {
				if (!document.hidden) {
					playBeep();
				}
				beepCount++;

				if (beepCount >= 120) {
					clearInterval(alarmInterval);
					alarmInterval = null;
					alarmActive = false;
					if (notificationInterval) {
						clearInterval(notificationInterval);
						notificationInterval = null;
					}
				}
			}, 1000);

			if (!document.hidden) {
				playBeep();
				setTimeout(playBeep, 200);
				setTimeout(playBeep, 400);
				setTimeout(playBeep, 600);
				setTimeout(playBeep, 800);
			}
		}

		function flashPage() {
			let flashCount = 0;
			const flashInterval = setInterval(() => {
				document.body.classList.toggle('is-flash', flashCount % 2 === 0);
				flashCount++;
				if (flashCount >= 20) {
					document.body.classList.remove('is-flash');
					clearInterval(flashInterval);
				}
			}, 500);
		}

		function updateDisplay() {
			const minutes = Math.floor(timeLeft / 60);
			const seconds = timeLeft % 60;
			const timeString = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
			timerDisplay.textContent = timeString;

			const progress = ((totalTime - timeLeft) / totalTime) * 100;
			progressBar.style.strokeDasharray = `${progress} 100`;
			progressBar.style.opacity = progress > 0.4 ? '1' : '0';

			if (isRunning) {
				const modeText = isWorkMode ? 'Work' : 'Break';
				document.title = `${timeString} - ${modeText} | Pomodoro Timer`;
			} else {
				document.title = 'Pomodoro Timer - Focus & Productivity';
			}
		}

		function calculateTimeLeft() {
			if (endTime && isRunning) {
				const now = Date.now();
				return Math.max(0, Math.floor((endTime - now) / 1000));
			}
			return timeLeft;
		}

		function startTimer() {
			if (timerInterval) return;

			if (alarmInterval) {
				clearInterval(alarmInterval);
				alarmInterval = null;
			}
			if (notificationInterval) {
				clearInterval(notificationInterval);
				notificationInterval = null;
			}
			alarmActive = false;

			if ('Notification' in window && Notification.permission === 'default') {
				Notification.requestPermission();
			}

			isRunning = true;
			startBtn.style.display = 'none';
			pauseBtn.style.display = 'inline-flex';

			endTime = Date.now() + (timeLeft * 1000);

			timerInterval = setInterval(() => {
				timeLeft = calculateTimeLeft();
				updateDisplay();

				if (timeLeft <= 0) {
					clearInterval(timerInterval);
					timerInterval = null;
					endTime = null;

					const completedWorkMode = isWorkMode;

					if (isWorkMode) {
						isWorkMode = false;
						timeLeft = breakDuration * 60;
						totalTime = breakDuration * 60;
						modeIndicator.textContent = 'Break time';
						modeIndicator.className = 'mode-indicator break';
						progressBar.className = 'progress-fill break';
						setBreakMode(true);
					} else {
						isWorkMode = true;
						timeLeft = workDuration * 60;
						totalTime = workDuration * 60;
						modeIndicator.textContent = 'Work session';
						modeIndicator.className = 'mode-indicator work';
						progressBar.className = 'progress-fill';
						setBreakMode(false);
					}

					updateDisplay();

					if (completedWorkMode) {
						showNotification('Break time', `Your ${workDuration}-minute work session is complete. Time for a ${breakDuration}-minute break.`);
					} else {
						showNotification('Work session', `Break is over. Time to focus for ${workDuration} minutes.`);
					}

					playAlarm();
					flashPage();
					document.title = 'Timer complete | Pomodoro Timer';

					setTimeout(() => {
						if (confirm(isWorkMode ? 'Start work session?' : 'Start break?')) {
							startTimer();
						} else {
							isRunning = false;
							startBtn.style.display = 'inline-flex';
							pauseBtn.style.display = 'none';
						}
					}, 1000);
				}
			}, 1000);
		}

		function pauseTimer() {
			if (timerInterval) {
				clearInterval(timerInterval);
				timerInterval = null;
				isRunning = false;
				endTime = null;
				startBtn.style.display = 'inline-flex';
				pauseBtn.style.display = 'none';
			}
			if (alarmInterval) {
				clearInterval(alarmInterval);
				alarmInterval = null;
			}
			if (notificationInterval) {
				clearInterval(notificationInterval);
				notificationInterval = null;
			}
			alarmActive = false;
		}

		function resetTimer() {
			pauseTimer();
			endTime = null;
			isWorkMode = true;
			workDuration = parseInt(workInput.value) || 50;
			breakDuration = parseInt(breakInput.value) || 10;
			timeLeft = workDuration * 60;
			totalTime = workDuration * 60;
			modeIndicator.textContent = 'Work session';
			modeIndicator.className = 'mode-indicator work';
			progressBar.className = 'progress-fill';
			setBreakMode(false);
			updateDisplay();
		}

		startBtn.addEventListener('click', startTimer);
		pauseBtn.addEventListener('click', pauseTimer);
		resetBtn.addEventListener('click', resetTimer);

		workInput.addEventListener('change', () => {
			if (!isRunning) {
				workDuration = parseInt(workInput.value) || 50;
				if (isWorkMode) {
					timeLeft = workDuration * 60;
					totalTime = workDuration * 60;
					updateDisplay();
				}
			}
		});

		breakInput.addEventListener('change', () => {
			if (!isRunning) {
				breakDuration = parseInt(breakInput.value) || 10;
				if (!isWorkMode) {
					timeLeft = breakDuration * 60;
					totalTime = breakDuration * 60;
					updateDisplay();
				}
			}
		});

		document.addEventListener('visibilitychange', () => {
			if (!document.hidden) {
				if (isRunning && endTime) {
					timeLeft = calculateTimeLeft();
					updateDisplay();
				}

				if (alarmActive) {
					if (alarmInterval) {
						clearInterval(alarmInterval);
						alarmInterval = null;
					}
					for (let i = 0; i < 10; i++) {
						setTimeout(() => {
							try {
								const audio = new Audio('data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAoUXrTp66hVFApGn+DyvmwhBSuBzvLZiTYIGWi77+efTRAMUKfj8LZjHAY4kdfyzHksBSR3x/DdkEAKFF606euoVRQKRp/g8r5sIQUrgc7y2Yk2CBlo');
								audio.volume = 1.0;
								audio.play().catch(() => {});
							} catch (e) {}
						}, i * 100);
					}
					playAlarm();
				}
			}
		});

		updateDisplay();
	</script>
